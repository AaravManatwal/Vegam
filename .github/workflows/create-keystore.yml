name: Create keystore (ek hi baar)

# Phone se signing key banane ka tareeka. REPO PRIVATE hona chahiye. Chalane ke baad:
# 1) Run ke Artifacts se "vegam-keystore-secrets" download karo (zip), andar secrets.txt kholo.
# 2) Repo Settings -> Secrets and variables -> Actions mein 3 secrets banao (naam/value secrets.txt se).
# 3) Artifact delete karo. Keystore ki ek copy kisi safe jagah rakho: kho gayi to Play Store app update nahi hogi.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore vegam-release.jks -alias vegam -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Vegam, O=Vegam, C=IN"
          {
            echo "VEGAM_KEYSTORE_PASSWORD=$PASS"
            echo "VEGAM_KEY_ALIAS=vegam"
            echo "VEGAM_KEYSTORE_BASE64=$(base64 -w0 vegam-release.jks)"
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vegam-keystore-secrets
          path: |
            secrets.txt
            vegam-release.jks
          retention-days: 1
