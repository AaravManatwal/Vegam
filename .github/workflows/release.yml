name: Vegam release

# Manual (Actions tab -> Run workflow) ya "v*" tag push par. Play Store ke liye signed AAB banata hai.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Pehle test: fail hua to release nahi banega.
      - name: Unit tests
        run: >
          gradle :core:engine:test :core:database:testDebugUnitTest :core:download:testDebugUnitTest :feature:smart:testDebugUnitTest
          :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest :feature:add:testDebugUnitTest
          :feature:detail:testDebugUnitTest :feature:stats:testDebugUnitTest :feature:settings:testDebugUnitTest
          :feature:onboarding:testDebugUnitTest --stacktrace

      - name: Keystore decode
        env:
          KEYSTORE_BASE64: ${{ secrets.VEGAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::VEGAM_KEYSTORE_BASE64 secret nahi mila: release UNSIGNED banega (Play Store par upload nahi hoga). Pehle 'Create keystore' workflow chalao."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vegam-release.jks"
            echo "VEGAM_KEYSTORE_PATH=$RUNNER_TEMP/vegam-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build AAB + APK
        env:
          VEGAM_KEYSTORE_PASSWORD: ${{ secrets.VEGAM_KEYSTORE_PASSWORD }}
          VEGAM_KEY_ALIAS: ${{ secrets.VEGAM_KEY_ALIAS }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vegam-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
